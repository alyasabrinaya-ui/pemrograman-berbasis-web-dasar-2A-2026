<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#EDF3FF]">
  <main class="min-h-screen grid grid-cols-1 md:grid-cols-2">
    <section class="bg-[#5E7AC4] flex flex-col justify-center px-10 md:px-24 text-white">
      <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-8">
        Hello Prospective <br /> Students
      </h1>

      <img src="ASSET/UTS/gambar_login page.png" class="gambar login page" />

      <p class="max-w-md text-sm font-semibold">
        Unlock your professional potential. Learn from industry leaders and stay ahead of the competition.
      </p>
    </section>

    <section class="flex items-center justify-center px-6">
      <div class="w-full max-w-sm">
        <h2 class="text-center font-bold text-lg">LOGIN PAGE</h2>
        <p class="text-center text-xs text-slate-500 mb-6">
          Masukkan Username dan Password Anda
        </p>

        <input class="w-full mb-4 px-4 py-3 rounded-md shadow-sm text-sm outline-none" placeholder="Email Address" />
        <input class="w-full mb-4 px-4 py-3 rounded-md shadow-sm text-sm outline-none" placeholder="Password" type="password" />

        <a href="home.html" class="block text-center w-full bg-[#3852B4] text-white py-3 rounded-md text-sm font-semibold">
          Login
        </a>

        <p class="text-center text-xs text-slate-400 my-4">Or Login With</p>

      
        
        <button class="w-full bg-white shadow-sm py-3 rounded-md text-sm font-semibold flex justify-center items-center">
            <img src="ASSET/UTS/ic_google.svg" class="mt-2 me-2" width="30" alt="logo google">
            sign-up with google 
        </button>
      </div>
    </section>
  </main>
</body>
</html>
